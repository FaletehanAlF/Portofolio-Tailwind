<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="All Certificates – Faletehan Portfolio" />
  <title>All Certificates | Faletehan</title>
  <link rel="stylesheet" href="../src/output.css" />
  <script src="https://unpkg.com/feather-icons/dist/feather.min.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    img { display: block; }
    .cert-card img { object-fit: contain; object-position: center; background-color: var(--color-bg-secondary); padding: .5rem; }
    #modal-cert-img { width:100%; max-height:75vh; object-fit:contain; object-position:center; background-color:var(--color-bg-secondary); }
  </style>
</head>
<body data-page="certificates">

  <!-- NAVBAR capsule -->
  <header class="fixed top-3 sm:top-4 left-0 right-0 z-50 px-3 sm:px-5">
    <div class="capsule-nav max-w-5xl mx-auto">
      <div class="capsule-bar h-14 sm:h-16 flex items-center justify-between gap-2 px-3 sm:px-5">
        <a href="../index.html#portfolio" class="flex items-center gap-2 group min-w-0" aria-label="Back">
          <span class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 transition-transform group-hover:-translate-x-0.5"
            style="background-color:var(--color-bg-secondary); border:1px solid var(--color-border);">
            <i data-feather="chevron-left" class="w-4 h-4" style="color:var(--color-accent);"></i>
          </span>
          <span class="text-sm font-bold truncate" style="color:var(--color-text);">Certificates</span>
        </a>
        <nav class="hidden md:flex items-center justify-center gap-2 flex-1" aria-label="Archive Navigation">
          <a href="../index.html#home" class="nav-link" data-i18n-archive="home">Home</a>
          <a href="projects.html" class="nav-link" data-i18n-archive="projects">Projects</a>
          <a href="certificates.html" class="nav-link active" data-i18n-archive="certificates">Certificates</a>
        </nav>
        <div class="flex items-center gap-2 flex-shrink-0">
          <button class="lang-toggle" id="lang-toggle" aria-label="Toggle Language">EN</button>
          <button class="toggle-btn !rounded-full" id="theme-toggle" aria-label="Toggle Theme">
            <i data-feather="sun" class="w-4 h-4 block" id="theme-icon-light"></i>
            <i data-feather="moon" class="w-4 h-4 hidden" id="theme-icon-dark"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="min-h-screen pt-28 sm:pt-32 pb-16">
    <div class="max-w-6xl mx-auto px-4 sm:px-5">

      <div class="text-center max-w-2xl mx-auto mb-8 sm:mb-10">
        <p class="section-label" data-i18n-archive="eyebrow">Achievements</p>
        <h1 class="font-extrabold tracking-tight text-2xl sm:text-3xl lg:text-4xl mb-3" style="color:var(--color-text);" data-i18n-archive="title">All Certificates</h1>
        <p class="text-sm sm:text-base leading-relaxed" style="color:var(--color-text-muted);" data-i18n-archive="subtitle">
          Verified courses &amp; awards. Click any card to preview. Data loaded live from API.
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3 sm:items-center mb-4">
        <div class="relative flex-1">
          <i data-feather="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" style="color:var(--color-text-muted);"></i>
          <input id="archive-search" type="search" class="form-input !pl-10 !rounded-full" placeholder="Search certificates..." autocomplete="off" />
        </div>
      </div>

      <div id="archive-filters" class="flex gap-2 overflow-x-auto pb-2 mb-6 sm:flex-wrap" style="scrollbar-width:none;"></div>

      <!-- Slider controls -->
      <div class="flex items-center justify-between gap-3 mb-4">
        <p class="text-xs font-semibold" style="color:var(--color-text-muted);">
          <span id="archive-count">0 items</span>
        </p>
        <div class="flex items-center gap-2">
          <button class="slider-btn" id="archive-prev" aria-label="Previous">
            <i data-feather="chevron-left" class="w-4 h-4"></i>
          </button>
          <button class="slider-btn" id="archive-next" aria-label="Next">
            <i data-feather="chevron-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Loading -->
      <div id="archive-loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
        <div class="skeleton h-72"></div>
        <div class="skeleton h-72 hidden sm:block"></div>
        <div class="skeleton h-72 hidden lg:block"></div>
      </div>

      <!-- Pager slider (from ../api/certificate.json) -->
      <div class="pager-viewport" id="archive-viewport" tabindex="0">
        <div class="pager-track" id="archive-track"></div>
      </div>

      <!-- Dots -->
      <div class="flex items-center justify-center gap-1.5 mt-5" id="archive-dots"></div>

      <!-- Empty -->
      <div id="archive-empty" class="hidden card p-10 text-center mt-2">
        <div class="w-12 h-12 rounded-2xl mx-auto mb-4 flex items-center justify-center" style="background-color:var(--color-bg-secondary); border:1px solid var(--color-border);">
          <i data-feather="award" class="w-5 h-5" style="color:var(--color-accent);"></i>
        </div>
        <p class="text-sm font-medium" style="color:var(--color-text-muted);" data-i18n-archive="empty">Nothing found. Try another keyword.</p>
      </div>

      <!-- Bottom nav -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mt-10">
        <a href="../index.html#portfolio" class="see-all-link"><i data-feather="arrow-left" class="w-4 h-4"></i> <span data-i18n-archive="backShowcase">Back to Showcase</span></a>
        <a href="projects.html" class="see-all-link"><span data-i18n-archive="seeOther">See Projects</span> <i data-feather="arrow-right" class="w-4 h-4"></i></a>
      </div>

    </div>
  </main>

  <!-- Certificate modal -->
  <div class="modal-backdrop" id="cert-modal" role="dialog" aria-modal="true" aria-labelledby="modal-cert-name">
    <div class="modal-content">
      <div class="relative">
        <img src="" alt="" id="modal-cert-img" class="w-full h-auto" />
        <button id="modal-close" class="absolute top-3 right-3 w-8 h-8 rounded-full flex items-center justify-center text-white" style="background-color:rgba(0,0,0,0.5);" aria-label="Close Modal">
          <i data-feather="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="p-6">
        <h3 class="text-base font-bold mb-1" id="modal-cert-name" style="color:var(--color-text);"></h3>
        <p class="text-sm font-semibold" style="color:var(--color-accent);" id="modal-cert-issuer"></p>
      </div>
    </div>
  </div>

  <footer style="background-color:var(--color-bg-secondary); border-top:1px solid var(--color-border);">
    <div class="max-w-6xl mx-auto px-5 py-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
      <p class="text-xs" style="color:var(--color-text-muted);">© 2026 Faletehan. All rights reserved.</p>
      <div class="flex items-center gap-4 text-xs font-medium" style="color:var(--color-text-muted);">
        <a href="../index.html#home" class="hover:underline">Home</a>
        <a href="projects.html" class="hover:underline">Projects</a>
        <a href="certificates.html" class="hover:underline">Certificates</a>
      </div>
    </div>
  </footer>

  <script src="../script/archive.js"></script>
</body>
</html>
